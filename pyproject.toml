[project]
name = "fccsignal"
version = "0.1.0"
description = "FCC equipment-authorization alt-data signal research pipeline"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
  "pyyaml>=6",
  "requests>=2.31",
  "pandera>=0.20",
  "prefect>=2.19",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "dvc>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
